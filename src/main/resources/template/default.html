     * 列宽和行高写入 head 里的样式，不改表格节点，避免 getValue 把布局交回 Lute。
     */
    const PREVIEW_TABLE_SIZE_STYLE_ID = "markdown-preview-table-sizes";
    const PREVIEW_TABLE_HEADER_KEY_LIMIT = 120;
    const previewTableResizeState = {
        sizesByKey: {},
        drag: null,
        guideElement: null,
        bound: false,
        refreshTimer: 0,
        edgeScrollFrame: 0
    };

    /**
     * 取某张表的尺寸记录。拖拽过程中优先用尚未提交的草稿，避免松手前写入半截宽度。
     */
    function readPreviewTableSizeRecord(key) {
        const drag = previewTableResizeState.drag;
        if (drag && drag.key === key && drag.previewRecord) {
            return drag.previewRecord;
        }
        return previewTableResizeState.sizesByKey[key] || null;
    }

    /**
     * 保证尺寸样式节点在 head 末尾，从而压过 Vditor 和 style.css 的表格规则。
     */
    function ensurePreviewTableSizeStyleElement() {
        const existing = document.getElementById(PREVIEW_TABLE_SIZE_STYLE_ID);
        if (existing) {
            return existing;
        }
        if (!document.head) {
            return null;
        }
        const styleElement = document.createElement("style");
        styleElement.id = PREVIEW_TABLE_SIZE_STYLE_ID;
        document.head.appendChild(styleElement);
        return styleElement;
    }

    function collectPreviewTableSurfaces() {
        const root = document.getElementById("vditor");
        const surfaces = [];
        if (!root) {
            return surfaces;
        }
        pushPreviewTableSurface(surfaces, root.querySelector(".vditor-ir pre.vditor-reset"));
        pushPreviewTableSurface(surfaces, root.querySelector(".vditor-wysiwyg pre.vditor-reset"));
        pushPreviewTableSurface(surfaces, root.querySelector(".vditor-preview .vditor-reset"));
        return surfaces;
    }

    function pushPreviewTableSurface(surfaces, surface) {
        if (surface) {
            surfaces.push(surface);
        }
    }

    function isNestedPreviewTable(table) {
        return !!(table.parentElement && table.parentElement.closest("table"));
    }

    function previewTableCellIsMerged(cell) {
        const colspan = parseInt(cell.getAttribute("colspan") || "1", 10);
        const rowspan = parseInt(cell.getAttribute("rowspan") || "1", 10);
        return colspan > 1 || rowspan > 1;
    }

    function previewTableHasMergedCell(table) {
        const cells = table.querySelectorAll("td, th");
        for (let index = 0; index < cells.length; index += 1) {
            if (previewTableCellIsMerged(cells[index])) {
                return true;
            }
        }
        return false;
    }

    /**
     * 源码区、内层表、合并单元格表不参与尺寸重放。
     */
    function isPreviewTableResizable(table) {
        if (!table || table.tagName !== "TABLE") {
            return false;
        }
        if (table.closest(".vditor-sv")) {
            return false;
        }
        if (isNestedPreviewTable(table)) {
            return false;
        }
        return !previewTableHasMergedCell(table);
    }

    function listTopLevelPreviewTables(surface) {
        const tables = surface.querySelectorAll("table");
        const result = [];
        for (let index = 0; index < tables.length; index += 1) {
            const table = tables[index];
            if (isNestedPreviewTable(table) || table.closest(".vditor-sv")) {
                continue;
            }
            result.push(table);
        }
        return result;
    }

    function resolvePreviewTableColumnCount(table) {
        const row = table.rows && table.rows[0];
        return row ? row.cells.length : 0;
    }

    function resolvePreviewTableHeaderText(table) {
        const row = table.rows && table.rows[0];
        if (!row) {
            return "";
        }
        const parts = [];
        for (let index = 0; index < row.cells.length; index += 1) {
            parts.push((row.cells[index].textContent || "").replace(/\s+/g, " ").trim());
        }
        const joined = parts.join(" ");
        if (joined.length <= PREVIEW_TABLE_HEADER_KEY_LIMIT) {
            return joined;
        }
        return joined.slice(0, PREVIEW_TABLE_HEADER_KEY_LIMIT);
    }

    /**
     * 同一文件、同一区域序号、同一列数和首行文本共用一条尺寸记录。
     */
    function resolvePreviewTableSizeKey(table, index) {
        const filePath = previewSyncState.currentFilePath || currentFilePath || "";
        const columnCount = resolvePreviewTableColumnCount(table);
        const headerText = resolvePreviewTableHeaderText(table);
        return filePath + "\n" + index + "\n" + columnCount + "\n" + headerText;
    }

    function resolveElementChildIndex(parent, node) {
        let index = 1;
        let sibling = parent.firstElementChild;
        while (sibling) {
            if (sibling === node) {
                return index;
            }
            index += 1;
            sibling = sibling.nextElementSibling;
        }
        return 0;
    }

    function resolvePreviewTableSurfaceSelector(surface) {
        if (!surface) {
            return "";
        }
        if (surface.closest(".vditor-preview")) {
            return "#vditor .vditor-preview .vditor-reset";
        }
        if (surface.closest(".vditor-wysiwyg")) {
            return "#vditor .vditor-wysiwyg pre.vditor-reset";
        }
        if (surface.closest(".vditor-ir")) {
            return "#vditor .vditor-ir pre.vditor-reset";
        }
        return "";
    }

    function buildPreviewTableChildPath(table, surface) {
        const parts = [];
        let node = table;
        while (node && node !== surface) {
            const parent = node.parentElement;
            if (!parent) {
                return "";
            }
            const index = resolveElementChildIndex(parent, node);
            if (!index) {
                return "";
            }
            parts.unshift(node.tagName.toLowerCase() + ":nth-child(" + index + ")");
            node = parent;
        }
        if (node !== surface) {
            return "";
        }
        return parts.join(" > ");
    }

    /**
     * 从滚动容器走到这张表的结构选择器。不给表格节点加 class 或 style。
     */
    function buildPreviewTableStructuralSelector(table, surface) {
        const surfaceSelector = resolvePreviewTableSurfaceSelector(surface);
        const childPath = buildPreviewTableChildPath(table, surface);
        if (!surfaceSelector || !childPath) {
            return "";
        }
        return surfaceSelector + " > " + childPath;
    }

    function buildPreviewTableRowSelector(tableSelector, rowElement) {
        const parent = rowElement.parentElement;
        if (!parent) {
            return "";
        }
        const index = resolveElementChildIndex(parent, rowElement);
        if (!index) {
            return "";
        }
        return tableSelector + " > " + parent.tagName.toLowerCase() + " > tr:nth-child(" + index + ")";
    }

    function appendPreviewTableColumnCss(rules, selector, widths) {
        let sum = 0;
        for (let index = 0; index < widths.length; index += 1) {
            sum += widths[index];
        }
        rules.push(selector + " { table-layout: fixed; width: " + sum + "px; }");
        for (let index = 0; index < widths.length; index += 1) {
            const width = widths[index] + "px";
            const nth = index + 1;
            const cells = selector + " tr > th:nth-child(" + nth + "), " + selector + " tr > td:nth-child(" + nth + ")";
            rules.push(cells + " { width: " + width + "; min-width: " + width + "; max-width: " + width
                + "; box-sizing: border-box; white-space: normal; overflow-wrap: anywhere; }");
        }
    }

    function appendPreviewTableRowCss(rules, selector, table, rowHeights) {
        const keys = Object.keys(rowHeights);
        for (let index = 0; index < keys.length; index += 1) {
            const rowIndex = parseInt(keys[index], 10);
            const height = rowHeights[keys[index]];
            if (!table.rows || !table.rows[rowIndex] || typeof height !== "number") {
                continue;
            }
            const rowSelector = buildPreviewTableRowSelector(selector, table.rows[rowIndex]);
            if (!rowSelector) {
                continue;
            }
            const heightText = height + "px";
            rules.push(rowSelector + " > th, " + rowSelector + " > td { height: " + heightText + "; min-height: " + heightText + "; }");
        }
    }

    function appendPreviewTableRules(rules, surface, table, index) {
        if (!isPreviewTableResizable(table)) {
            return;
        }
        const selector = buildPreviewTableStructuralSelector(table, surface);
        const record = readPreviewTableSizeRecord(resolvePreviewTableSizeKey(table, index));
        if (!selector || !record) {
            return;
        }
        if (record.columnWidths && record.columnWidths.length) {
            appendPreviewTableColumnCss(rules, selector, record.columnWidths);
        }
        if (record.rowHeights) {
            appendPreviewTableRowCss(rules, selector, table, record.rowHeights);
        }
    }

    function appendPreviewTableSurfaceRules(rules, surface) {
        const tables = listTopLevelPreviewTables(surface);
        for (let index = 0; index < tables.length; index += 1) {
            appendPreviewTableRules(rules, surface, tables[index], index);
        }
    }

    /**
     * 按内存记录重写 head 中的尺寸样式。未拖过的表不生成规则。
     */
    function applyPreviewTableSizeStyles() {
        const styleElement = ensurePreviewTableSizeStyleElement();
        if (!styleElement) {
            return;
        }
        const rules = [];
        const surfaces = collectPreviewTableSurfaces();
        for (let index = 0; index < surfaces.length; index += 1) {
            appendPreviewTableSurfaceRules(rules, surfaces[index]);
        }
        styleElement.textContent = rules.join("\n");
    }

    function exportFile(type) {
        let options = {
            mode: "light",
            anchor: 2,
            lang: vditor.vditor.options.lang,
            hljs: vditor.vditor.options.preview.hljs,
            speech: {enable: false},
            math: vditor.vditor.options.preview.math,
            cdn: vditor.vditor.options.cdn,
            markdown: vditor.vditor.options.preview.markdown,
            theme: vditor.vditor.options.preview.theme,
            icon: vditor.vditor.options.icon
        }
        options.theme.current = "idea-light";
        Vditor.md2html(vditor.getValue(), options).then((content) => {
            let html = "<html>"
                + "<head>"
                + "<meta charset=\"utf-8\" />"
                + "<link rel=\"stylesheet\" type=\"text/css\" href=\"" + options.cdn + "/dist/index.css\"/>"
                + "<script src=\"" + options.cdn + "/dist/js/i18n/" + options.lang + ".js\"><\/script>"
                + "<script src=\"" + options.cdn + "/dist/method.min.js\"><\/script>"
                + "</head>"
                + "<body style=\"width: 1075px;\">"
                + "<div class=\"vditor-reset\" id=\"preview\">" + content + "</div>"
                + "<script>"
                + "    const previewElement = document.getElementById('preview');"
                + "    Vditor.setContentTheme('" + options.theme.current + "', '" + options.theme.path + "');"
                + "    Vditor.codeRender(previewElement);"
                + "    Vditor.highlightRender(" + JSON.stringify(options.hljs) + ", previewElement, '" + options.cdn + "');"
                + "    Vditor.mathRender(previewElement, { cdn: '" + options.cdn + "',math: " + JSON.stringify(options.math) + "});"
                + "    Vditor.mermaidRender(previewElement, '" + options.cdn + "', '" + options.mode + "');"
                + "    Vditor.flowchartRender(previewElement, '" + options.cdn + "');"
                + "    Vditor.graphvizRender(previewElement, '" + options.cdn + "');"
                + "    Vditor.chartRender(previewElement, '" + options.cdn + "', '" + options.mode + "');"
                + "    Vditor.mindmapRender(previewElement, '" + options.cdn + "', '" + options.mode + "');"
                + "    Vditor.abcRender(previewElement, '" + options.cdn + "');"
                + "    Vditor.mediaRender(previewElement);"
                + "    Vditor.speechRender(previewElement);"
                + " <\/script> "
                + " <script src=\"" + options.cdn + "/dist/js/icons/" + options.icon + ".js\"><\/script>"
                + "</body></html>";

            $.post(exportUrl, {
                "value": html,
                "type": type,
                "cdn": options.cdn,
                "themeCdn": options.theme.path
            }, function (data) {
                if (data.success === false) {
                    vditor.tip("Failed to Export file", 0);
                }
            }).fail(function () {
                vditor.tip("Save file request error", 0);
            })
        });
    }

    const vditor = new Vditor('vditor', {
        "theme": darcula ? "dark" : "light",
        "height": document.documentElement.clientHeight,
        "lang": "{{Lang}}",
        "cache": {
            "enable": false
        },
        "toolbar": [
            {"name": "emoji", "tipPosition": "s"},
            {"name": "headings", "tipPosition": "s"},
            {"name": "bold", "tipPosition": "s"},
            {"name": "italic", "tipPosition": "s"},
            {"name": "strike", "tipPosition": "s"},
            {"name": "link", "tipPosition": "s"},
            "|",
            {"name": "list", "tipPosition": "s"},
            {"name": "ordered-list", "tipPosition": "s"},
            {"name": "check", "tipPosition": "s"},
            {"name": "outdent", "tipPosition": "s"},
            {"name": "indent", "tipPosition": "s"},
            "|",
            {"name": "quote", "tipPosition": "s"},
            {"name": "line", "tipPosition": "s"},
            {"name": "code", "tipPosition": "s"},
            {"name": "inline-code", "tipPosition": "s"},
            {"name": "insert-before", "tipPosition": "s"},
            {"name": "insert-after", "tipPosition": "s"},
            {"name": "table", "tipPosition": "s"},
            {"name": "upload", "tipPosition": "s"},
            "|",
            {"name": "undo", "tipPosition": "s"},
            {"name": "redo", "tipPosition": "s"},
            {
                "name": "format",
                "tip": "format",
                "tipPosition": "s",
                "icon": document.getElementById("format").innerHTML,
                click() {
                    editBlur(vditor.getValue(),true)
                }
            },
            "|",
            {"name": "edit-mode", "tipPosition": "w"},
            {
                "name": "donate",
                "tip": "donate",
                "tipPosition": "s",
                "icon": document.getElementById("donate").innerHTML,
                click() {
                    window.open("https://shuzijun.com/donate.html");
                }
            },
            {
                name: "more",
                toolbar: [
                    "both",
                    "code-theme",
                    "content-theme",
                    "outline",
                    "preview",
                    "devtools",
                    "export",
                    "info"
                ],
            },
        ],
        "toolbarConfig": {"pin": true},
        "cdn": vditorCDN,
        "preview": {
            "theme": {
                "current": darcula ? "idea-dark" : "idea-light",
                "path": vditorThemeCDN
            },
            "markdown": {
                "sanitize": false
            },
            "maxWidth": Math.min(Math.max($(window).width() - 100, 720), 1080),
            "actions": ["desktop", "tablet", "mobile"],
            "hljs": {"style": previewCodeTheme},
            "math": {
                "inlineDigit": true
            }
        },
        "counter": {
            "enable": true
        },
        "upload": {
            "url": uploadUrl,
            format(files, responseText) {
                saveTime = Date.now() + 5000;
                return responseText;
            }
        },
        "image": {
            preview(image) {
                requestPreviewImage(image);
            }
        },
        "value": initValue(),
        after() {
            fileValue = vditor.getValue()
            bindReadonlyInteractionGuards();
            bindPreviewHorizontalWheelNormalization();
            bindPreviewSyncListeners();
            initToolbarExtensions();
            ensureMermaidPreviewMutationObserver();
            const appliedCodeTheme = applyPreviewCodeTheme(previewCodeTheme, false, "programmatic");
            if (appliedCodeTheme !== previewCodeTheme) {
                emitPreviewSyncMessage("previewCodeThemeChanged", {codeTheme: appliedCodeTheme}, "programmatic");
            }
            window.setPreviewToolbarVisible(previewToolbarVisible);
            window.setPreviewEditable(previewEditable);
            schedulePreviewSyncArtifactsRebuild("after");
            scheduleMermaidPreviewDecoration("after");
            emitPreviewSyncMessage("previewReady", {}, "activation", previewSyncState.lastAppliedContentVersion);
            emitPreviewSyncMessage("previewDirtyChanged", {dirty: false}, "programmatic", previewSyncState.lastAppliedContentVersion);
        },
        blur(md) {
            editBlur(md,false)
        },
        focus(md) {
            editFocus(md)
        },
        input(md) {
            editInput(md)
        }
    });

    function updateStyle(style, darcula) {
        let newStyle = document.createElement('style');
        newStyle.id = 'ideaStyle';
        newStyle.innerHTML = style;
        let oldStyle = document.getElementById('ideaStyle');
        oldStyle.parentNode.replaceChild(newStyle, oldStyle);
        vditor.setTheme(darcula ? "dark" : "light", darcula ? "idea-dark" : "idea-light", vditor.vditor.options.preview.hljs.style || previewCodeTheme, vditorThemeCDN)
        applyPreviewCodeTheme(vditor.vditor.options.preview.hljs.style || previewCodeTheme, false, "programmatic");
    }


    function updateHeight(width, height) {
        setTimeout(function (width, height) {
            if (window.innerHeight < height) {
                return
            }
            let vditorDom = document.getElementById('vditor');
            vditorDom.style.paddingTop = (window.innerHeight - height) + "px";
        }, 500, width, height)
    }
</script>
<script>
    {{injectScript}}
</script>
{{ideStyle}}
</html>
