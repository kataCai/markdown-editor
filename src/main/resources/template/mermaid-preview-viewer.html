<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0c1017;
        }

        /* 查看窗口里的 foreignObject 不再经过预览页样式，这里补上同一套标签字体和换行规则。 */
        .markdown-preview-figure-viewer foreignObject div {
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif !important;
            font-size: 16px !important;
            white-space: pre-line !important;
            max-width: none !important;
            overflow-wrap: anywhere !important;
            display: inline-block !important;
        }

        /* Mermaid 悬浮查看层覆盖整个预览页面，用于承载放大后的 SVG 查看交互。 */
        .markdown-preview-figure-viewer {
            position: fixed;
            inset: 0;
            z-index: 2147483000;
            display: flex;
            flex-direction: column;
            background: rgba(12, 16, 23, 0.78);
            backdrop-filter: blur(4px);
        }

        /* 查看层工具条固定在右上角，承载放大、缩小、重置和关闭操作。 */
        .markdown-preview-figure-viewer__toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 16px;
            pointer-events: none;
        }

        .markdown-preview-figure-viewer__toolbar-group {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(18, 21, 27, 0.76);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
            pointer-events: auto;
        }

        .markdown-preview-figure-viewer__button {
            width: 32px;
            min-width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 7px;
            background: rgba(28, 33, 42, 0.86);
            color: #f5f7fa;
            cursor: pointer;
            font-size: 0;
            line-height: 1;
            transition: background-color 0.16s ease-in-out, border-color 0.16s ease-in-out, color 0.16s ease-in-out;
        }

        .markdown-preview-figure-viewer__button svg {
            width: 16px;
            height: 16px;
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .markdown-preview-figure-viewer__button:hover,
        .markdown-preview-figure-viewer__button:focus-visible {
            background: rgba(49, 77, 121, 0.92);
            border-color: rgba(129, 169, 255, 0.64);
            outline: none;
        }

        /* 查看层滚动区域负责承接大图浏览，不再占用正文滚动容器。 */
        .markdown-preview-figure-viewer__viewport {
            flex: 1;
            overflow: auto;
            padding: 0 24px 24px;
        }

        .markdown-preview-figure-viewer__canvas {
            min-width: 100%;
            min-height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 内容容器显式维护缩放后的几何尺寸，让滚动条能感知放大后的真实占位。 */
        .markdown-preview-figure-viewer__content {
            position: relative;
            margin: 24px auto;
            transform-origin: top left;
        }

        .markdown-preview-figure-viewer__viewport {
            cursor: grab;
        }

        .markdown-preview-figure-viewer__viewport.is-dragging {
            cursor: grabbing;
            user-select: none;
        }

        .markdown-preview-figure-viewer__content svg {
            display: block;
            max-width: none;
            height: auto;
        }
    </style>
</head>
<body>
<script>
{{injectScript}}
</script>
<script>
    const INITIAL_SVG_MARKUP = {{svgMarkupJson}};
    const INITIAL_BASE_WIDTH = {{baseWidth}};
    const INITIAL_BASE_HEIGHT = {{baseHeight}};
    const MERMAID_PREVIEW_VIEWER_CLASS = "markdown-preview-figure-viewer";
    const MERMAID_PREVIEW_SCALE_MIN = 0.5;
    const MERMAID_PREVIEW_SCALE_MAX = 4;
    const MERMAID_PREVIEW_SCALE_STEP = 0.2;
    const MERMAID_PREVIEW_DRAG_THRESHOLD_PX = 6;
    const MERMAID_PREVIEW_FALLBACK_WIDTH = 960;
    const MERMAID_PREVIEW_FALLBACK_HEIGHT = 540;
    const mermaidPreviewViewerState = {
        root: null,
        viewport: null,
        content: null,
        svgElement: null,
        open: false,
        scale: 1,
        minScale: MERMAID_PREVIEW_SCALE_MIN,
        maxScale: MERMAID_PREVIEW_SCALE_MAX,
        step: MERMAID_PREVIEW_SCALE_STEP,
        baseWidth: 0,
        baseHeight: 0,
        previousBodyOverflow: "",
        dragPointerId: null,
        dragStarted: false,
        dragStartClientX: 0,
        dragStartClientY: 0,
        dragStartScrollLeft: 0,
        dragStartScrollTop: 0
    };

    function isMermaidPreviewViewerOpen() {
        return !!(mermaidPreviewViewerState.open
            && mermaidPreviewViewerState.root
            && mermaidPreviewViewerState.viewport
            && mermaidPreviewViewerState.content
            && mermaidPreviewViewerState.svgElement);
    }

    /**
     * 判断事件目标是否命中 Mermaid 悬浮查看层。
     * 现有预览联动监听挂在 document 级别，因此必须在入口处显式排除查看层事件，避免滚轮和点击串扰。
     *
     * @param eventTarget 原始事件目标，可能是元素节点，也可能是文本节点
     * @return 命中查看层根节点时返回 true，否则返回 false
     */
    function isMermaidPreviewViewerEventTarget(eventTarget) {
        const viewerRoot = mermaidPreviewViewerState.root
            || document.querySelector("." + MERMAID_PREVIEW_VIEWER_CLASS);
        if (!viewerRoot || !eventTarget) {
            return false;
        }
        const normalizedTarget = eventTarget.nodeType === Node.ELEMENT_NODE
            ? eventTarget
            : eventTarget.parentElement;
        return !!(normalizedTarget && viewerRoot.contains(normalizedTarget));
    }

    /**
     * 创建查看层工具栏按钮，并统一绑定事件隔离逻辑。
     * 查看层按钮不应抢占正文焦点或触发 document 级别联动监听，因此按下和点击都要阻断冒泡。
     *
     * @param iconName 按钮图标名称，只允许使用当前查看层定义的四个图标标识
     * @param title 按钮提示文案
     * @param onClick 点击后的业务处理函数
     * @return 已绑定事件的按钮节点
     */
    function buildMermaidPreviewViewerButton(iconName, title, onClick) {
        const buttonElement = document.createElement("button");
        buttonElement.className = "markdown-preview-figure-viewer__button";
        buttonElement.type = "button";
        buttonElement.innerHTML = getMermaidPreviewViewerIconMarkup(iconName);
        buttonElement.setAttribute("title", title);
        buttonElement.setAttribute("aria-label", title);
        buttonElement.addEventListener("mousedown", function (event) {
            event.preventDefault();
            event.stopPropagation();
        }, true);
        buttonElement.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            onClick();
        }, true);
        return buttonElement;
    }

    /**
     * 构造 Mermaid 查看层工具栏使用的内联 SVG 图标。
     * 图标直接嵌入模板，避免依赖字体、外部图标库或额外资源加载，保证 JCEF 和不同主题下都能保持稳定形状。
     * 未知图标名称回退为关闭图标，防止按钮出现空白且保留明确的视觉反馈。
     *
     * @param iconName 图标名称，支持 zoom-in、zoom-out、reset 和 close
     * @return 包含 data-mermaid-viewer-icon 标记的 SVG 字符串
     */
    function getMermaidPreviewViewerIconMarkup(iconName) {
        if (iconName === "zoom-in") {
            return "<svg data-mermaid-viewer-icon=\"zoom-in\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">"
                + "<circle cx=\"10.5\" cy=\"10.5\" r=\"5.5\"></circle>"
                + "<path d=\"M15 15l4.25 4.25\"></path>"
                + "<path d=\"M10.5 8v5M8 10.5h5\"></path>"
                + "</svg>";
        }
        if (iconName === "zoom-out") {
            return "<svg data-mermaid-viewer-icon=\"zoom-out\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">"
                + "<circle cx=\"10.5\" cy=\"10.5\" r=\"5.5\"></circle>"
                + "<path d=\"M15 15l4.25 4.25\"></path>"
                + "<path d=\"M8 10.5h5\"></path>"
                + "</svg>";
        }
        if (iconName === "reset") {
            return "<svg data-mermaid-viewer-icon=\"reset\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">"
                + "<path d=\"M6.25 9.25A6.75 6.75 0 1 1 6.5 15\"></path>"
                + "<path d=\"M6.25 5.75v3.5h3.5\"></path>"
                + "</svg>";
        }
        return "<svg data-mermaid-viewer-icon=\"close\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">"
            + "<path d=\"M6.5 6.5l11 11M17.5 6.5l-11 11\"></path>"
            + "</svg>";
    }

    /**
     * 在查看层中绑定滚轮缩放。
     * 滚轮事件只在查看层内部消费，避免把图形查看动作误上报成正文滚动意图。
     *
     * @param container 查看层滚动容器
     */
    function bindMermaidPreviewWheel(container) {
        if (!container || container.dataset.mermaidPreviewWheelBound === "true") {
            return;
        }
        container.dataset.mermaidPreviewWheelBound = "true";
        container.addEventListener("wheel", function (event) {
            if (!isMermaidPreviewViewerEventTarget(event.target)) {
                return;
            }
            if (!event || event.deltaY === 0) {
                return;
            }
            event.preventDefault();
            event.stopPropagation();
            const delta = event.deltaY < 0 ? mermaidPreviewViewerState.step : -mermaidPreviewViewerState.step;
            updateMermaidPreviewScale(mermaidPreviewViewerState.scale + delta, "wheel");
        }, {passive: false});
    }

    /**
     * 收口 Mermaid 查看层的拖拽视觉状态。
     * 查看层关闭、指针取消或拖拽结束时都需要复用同一出口，避免 viewport 残留抓取光标。
     */
    function syncMermaidPreviewDragCursor() {
        if (!mermaidPreviewViewerState.viewport) {
            return;
        }
        mermaidPreviewViewerState.viewport.classList.toggle("is-dragging", !!mermaidPreviewViewerState.dragStarted);
    }

    /**
     * 结束当前 Mermaid 查看层拖拽状态并释放捕获。
     * 这里只回收查看层内部的临时拖拽状态，不修改正文联动标志，避免把 viewer 生命周期和正文状态耦合。
     *
     * @param event 触发拖拽结束的原始事件；为空时表示在查看层关闭流程中做兜底清理
     */
    function finishMermaidPreviewDrag(event) {
        const viewport = mermaidPreviewViewerState.viewport;
        const pointerId = mermaidPreviewViewerState.dragPointerId;
        if (viewport && typeof pointerId === "number"
            && typeof viewport.hasPointerCapture === "function"
            && viewport.hasPointerCapture(pointerId)
            && typeof viewport.releasePointerCapture === "function") {
            viewport.releasePointerCapture(pointerId);
        }
        mermaidPreviewViewerState.dragPointerId = null;
        mermaidPreviewViewerState.dragStarted = false;
        mermaidPreviewViewerState.dragStartClientX = 0;
        mermaidPreviewViewerState.dragStartClientY = 0;
        mermaidPreviewViewerState.dragStartScrollLeft = 0;
        mermaidPreviewViewerState.dragStartScrollTop = 0;
        syncMermaidPreviewDragCursor();
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
    }

    /**
     * 在查看层 viewport 上绑定拖拽平移能力。
     * 主路径优先使用 pointer 事件和 capture；当运行环境不支持时，再回退到传统 mouse 事件，保证 JCEF 下的兼容性。
     *
     * @param container 查看层滚动容器
     */
    function bindMermaidPreviewDrag(container) {
        if (!container || container.dataset.mermaidPreviewDragBound === "true") {
            return;
        }
        container.dataset.mermaidPreviewDragBound = "true";
        /**
         * 记录一次新的拖拽起点。
         * 这里不立即切到 dragging 态，而是等待移动距离超过阈值，避免轻点被误判成拖拽。
         *
         * @param pointerId 当前交互对应的 pointer id；mouse fallback 时传 -1
         * @param clientX 指针按下时的屏幕横坐标
         * @param clientY 指针按下时的屏幕纵坐标
         */
        function startDrag(pointerId, clientX, clientY) {
            mermaidPreviewViewerState.dragPointerId = pointerId;
            mermaidPreviewViewerState.dragStarted = false;
            mermaidPreviewViewerState.dragStartClientX = clientX;
            mermaidPreviewViewerState.dragStartClientY = clientY;
            mermaidPreviewViewerState.dragStartScrollLeft = container.scrollLeft;
            mermaidPreviewViewerState.dragStartScrollTop = container.scrollTop;
            syncMermaidPreviewDragCursor();
        }

        /**
         * 根据当前指针位置推进拖拽平移。
         * 通过直接改写 viewport 的滚动偏移实现“拖动画布”的体验，不移动克隆后的 SVG 节点本身。
         *
         * @param clientX 当前指针横坐标
         * @param clientY 当前指针纵坐标
         */
        function moveDrag(clientX, clientY) {
            if (mermaidPreviewViewerState.dragPointerId === null) {
                return;
            }
            const deltaX = clientX - mermaidPreviewViewerState.dragStartClientX;
            const deltaY = clientY - mermaidPreviewViewerState.dragStartClientY;
            if (!mermaidPreviewViewerState.dragStarted) {
                if (Math.abs(deltaX) < MERMAID_PREVIEW_DRAG_THRESHOLD_PX
                    && Math.abs(deltaY) < MERMAID_PREVIEW_DRAG_THRESHOLD_PX) {
                    return;
                }
                mermaidPreviewViewerState.dragStarted = true;
                syncMermaidPreviewDragCursor();
            }
            container.scrollLeft = mermaidPreviewViewerState.dragStartScrollLeft - deltaX;
            container.scrollTop = mermaidPreviewViewerState.dragStartScrollTop - deltaY;
        }

        if (window.PointerEvent) {
            container.addEventListener("pointerdown", function (event) {
                if (!isMermaidPreviewViewerEventTarget(event.target) || !event || event.button !== 0) {
                    return;
                }
                startDrag(event.pointerId, event.clientX, event.clientY);
                if (typeof container.setPointerCapture === "function") {
                    container.setPointerCapture(event.pointerId);
                }
                event.preventDefault();
                event.stopPropagation();
            }, true);
            container.addEventListener("pointermove", function (event) {
                if (!event || event.pointerId !== mermaidPreviewViewerState.dragPointerId) {
                    return;
                }
                moveDrag(event.clientX, event.clientY);
                if (mermaidPreviewViewerState.dragStarted) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            }, true);
            container.addEventListener("pointerup", function (event) {
                if (!event || event.pointerId !== mermaidPreviewViewerState.dragPointerId) {
                    return;
                }
                finishMermaidPreviewDrag(event);
            }, true);
            container.addEventListener("pointercancel", function (event) {
                if (!event || event.pointerId !== mermaidPreviewViewerState.dragPointerId) {
                    return;
                }
                finishMermaidPreviewDrag(event);
            }, true);
            container.addEventListener("lostpointercapture", function () {
                if (mermaidPreviewViewerState.dragPointerId !== null) {
                    finishMermaidPreviewDrag(null);
                }
            }, true);
            return;
        }

        container.addEventListener("mousedown", function (event) {
            if (!isMermaidPreviewViewerEventTarget(event.target) || !event || event.button !== 0) {
                return;
            }
            startDrag(-1, event.clientX, event.clientY);
            event.preventDefault();
            event.stopPropagation();
        }, true);
        window.addEventListener("mousemove", function (event) {
            if (!event || mermaidPreviewViewerState.dragPointerId !== -1 || !isMermaidPreviewViewerOpen()) {
                return;
            }
            moveDrag(event.clientX, event.clientY);
            if (mermaidPreviewViewerState.dragStarted) {
                event.preventDefault();
            }
        }, true);
        window.addEventListener("mouseup", function (event) {
            if (!event || mermaidPreviewViewerState.dragPointerId !== -1) {
                return;
            }
            finishMermaidPreviewDrag(event);
        }, true);
    }

    /**
     * 统一更新查看层的 SVG 缩放比例。
     * 这里显式维护内容容器宽高，让滚动条感知放大后的真实占位，同时尽量保持缩放前后的可视中心连续。
     *
     * @param nextScale 期望设置的缩放比例
     * @param source 本次缩放的触发来源，用于区分打开/重置和普通缩放时的滚动定位策略
     */
    function updateMermaidPreviewScale(nextScale, source) {
        if (!isMermaidPreviewViewerOpen()) {
            return;
        }
        const viewport = mermaidPreviewViewerState.viewport;
        const content = mermaidPreviewViewerState.content;
        const svgElement = mermaidPreviewViewerState.svgElement;
        const previousScale = mermaidPreviewViewerState.scale || 1;
        const previousWidth = mermaidPreviewViewerState.baseWidth * previousScale;
        const previousHeight = mermaidPreviewViewerState.baseHeight * previousScale;
        const centerX = viewport.scrollLeft + viewport.clientWidth / 2;
        const centerY = viewport.scrollTop + viewport.clientHeight / 2;
        const clampedScale = Math.max(
            mermaidPreviewViewerState.minScale,
            Math.min(mermaidPreviewViewerState.maxScale, Math.round(nextScale * 100) / 100)
        );
        mermaidPreviewViewerState.scale = clampedScale;
        svgElement.style.width = mermaidPreviewViewerState.baseWidth + "px";
        svgElement.style.height = mermaidPreviewViewerState.baseHeight + "px";
        svgElement.style.transformOrigin = "top left";
        svgElement.style.transform = "scale(" + clampedScale + ")";
        content.style.width = mermaidPreviewViewerState.baseWidth * clampedScale + "px";
        content.style.height = mermaidPreviewViewerState.baseHeight * clampedScale + "px";
        if (source === "open" || source === "reset") {
            viewport.scrollLeft = Math.max(0, (mermaidPreviewViewerState.baseWidth * clampedScale - viewport.clientWidth) / 2);
            viewport.scrollTop = 0;
            return;
        }
        const nextWidth = mermaidPreviewViewerState.baseWidth * clampedScale;
        const nextHeight = mermaidPreviewViewerState.baseHeight * clampedScale;
        const ratioX = previousWidth > 0 ? centerX / previousWidth : 0.5;
        const ratioY = previousHeight > 0 ? centerY / previousHeight : 0.5;
        viewport.scrollLeft = Math.max(0, ratioX * nextWidth - viewport.clientWidth / 2);
        viewport.scrollTop = Math.max(0, ratioY * nextHeight - viewport.clientHeight / 2);
    }

    /**
     * 将查看层缩放恢复到初始比例。
     * 需求里的“撤销”在本次实现中解释为重置缩放状态，而不是编辑内容撤销。
     */
    function resetMermaidPreviewScale() {
        updateMermaidPreviewScale(1, "reset");
    }

    /**
     * 关闭 Mermaid 悬浮查看层并恢复页面原始滚动状态。
     * 查看层关闭时只回收当前临时 DOM 和 body 样式，不触碰正文选区与宿主同步状态。
     */
    function closeMermaidPreviewViewer() {
        finishMermaidPreviewDrag(null);
        if (typeof window.previewSyncBridge !== "function") {
            return;
        }
        window.previewSyncBridge(JSON.stringify({
            type: "previewMermaidClose",
            filePath: "",
            contentVersion: 0,
            timestamp: Date.now(),
            source: "user",
            payload: {}
        }));
    }

    /**
     * 创建一次查看层骨架。
     * SVG 由后续的 HTML 片段插入，不在预览页里克隆节点。
     */
    function ensureMermaidPreviewViewerShell() {
        if (mermaidPreviewViewerState.root) {
            return;
        }
        const viewerRoot = document.createElement("div");
        viewerRoot.className = MERMAID_PREVIEW_VIEWER_CLASS;
        viewerRoot.setAttribute("role", "dialog");
        viewerRoot.setAttribute("aria-modal", "true");
        viewerRoot.setAttribute("aria-label", "Mermaid 图查看器");
        const toolbarElement = document.createElement("div");
        toolbarElement.className = "markdown-preview-figure-viewer__toolbar";
        const toolbarGroupElement = document.createElement("div");
        toolbarGroupElement.className = "markdown-preview-figure-viewer__toolbar-group";
        toolbarGroupElement.appendChild(buildMermaidPreviewViewerButton("zoom-in", "放大", function () {
            updateMermaidPreviewScale(mermaidPreviewViewerState.scale + mermaidPreviewViewerState.step, "zoomIn");
        }));
        toolbarGroupElement.appendChild(buildMermaidPreviewViewerButton("zoom-out", "缩小", function () {
            updateMermaidPreviewScale(mermaidPreviewViewerState.scale - mermaidPreviewViewerState.step, "zoomOut");
        }));
        toolbarGroupElement.appendChild(buildMermaidPreviewViewerButton("reset", "重置缩放", function () {
            resetMermaidPreviewScale();
        }));
        toolbarGroupElement.appendChild(buildMermaidPreviewViewerButton("close", "关闭查看层", function () {
            closeMermaidPreviewViewer();
        }));
        toolbarElement.appendChild(toolbarGroupElement);
        const viewportElement = document.createElement("div");
        viewportElement.className = "markdown-preview-figure-viewer__viewport";
        const canvasElement = document.createElement("div");
        canvasElement.className = "markdown-preview-figure-viewer__canvas";
        const contentElement = document.createElement("div");
        contentElement.className = "markdown-preview-figure-viewer__content";
        canvasElement.appendChild(contentElement);
        viewportElement.appendChild(canvasElement);
        viewerRoot.appendChild(toolbarElement);
        viewerRoot.appendChild(viewportElement);
        document.body.appendChild(viewerRoot);
        mermaidPreviewViewerState.root = viewerRoot;
        mermaidPreviewViewerState.viewport = viewportElement;
        mermaidPreviewViewerState.content = contentElement;
        bindMermaidPreviewWheel(viewportElement);
        bindMermaidPreviewDrag(viewportElement);
    }

    /**
     * 把宿主送来的 SVG HTML 片段插入查看层。
     * 用 innerHTML 保留 foreignObject 中的 HTML 标签。
     *
     * @param markup 已渲染 SVG 的 HTML 片段
     * @param width 基础宽度
     * @param height 基础高度
     */
    function replaceMermaidPreviewSvg(markup, width, height) {
        ensureMermaidPreviewViewerShell();
        const content = mermaidPreviewViewerState.content;
        finishMermaidPreviewDrag(null);
        content.innerHTML = markup || "";
        const svgElement = content.querySelector("svg");
        if (!svgElement) {
            mermaidPreviewViewerState.svgElement = null;
            mermaidPreviewViewerState.open = false;
            return;
        }
        svgElement.removeAttribute("width");
        svgElement.removeAttribute("height");
        mermaidPreviewViewerState.svgElement = svgElement;
        mermaidPreviewViewerState.baseWidth = normalizeMermaidPreviewSize(width, MERMAID_PREVIEW_FALLBACK_WIDTH);
        mermaidPreviewViewerState.baseHeight = normalizeMermaidPreviewSize(height, MERMAID_PREVIEW_FALLBACK_HEIGHT);
        mermaidPreviewViewerState.open = true;
        mermaidPreviewViewerState.scale = 1;
        updateMermaidPreviewScale(1, "open");
    }

    /**
     * 把缺失或非正数的尺寸退回查看层默认值。
     *
     * @param value 调用方传入的尺寸
     * @param fallback 默认尺寸
     * @return 大于 0 的整数尺寸
     */
    function normalizeMermaidPreviewSize(value, fallback) {
        const numericValue = Number(value);
        if (!isFinite(numericValue) || numericValue < 1) {
            return fallback;
        }
        return Math.round(numericValue);
    }

    function showInitialMermaidPreview() {
        const queued = window.__queuedMermaidPreview;
        if (queued && queued.markup) {
            replaceMermaidPreviewSvg(queued.markup, queued.width, queued.height);
            return;
        }
        replaceMermaidPreviewSvg(INITIAL_SVG_MARKUP, INITIAL_BASE_WIDTH, INITIAL_BASE_HEIGHT);
    }

    document.addEventListener("keydown", function (event) {
        if (!event || event.key !== "Escape") {
            return;
        }
        event.preventDefault();
        closeMermaidPreviewViewer();
    });

    showInitialMermaidPreview();
</script>
</body>
</html>
